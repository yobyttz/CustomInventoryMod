name: Build Android Native Mod (.so)

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar mod nativo ARM64
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-26 \
                -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: Guardar archivo .so compilado
        uses: actions/upload-artifact@v4
        with:
          name: CustomInventoryMod-arm64-v8a
          path: build/libCustomInventoryMod.so
